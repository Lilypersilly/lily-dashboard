[package]
name = "lily-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9" # keep your current version
gtk4-layer-shell = "0.4" # keep your current version
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rookie = "0.5"
souvlaki = { version = "0.7", default-features = false, features = ["use_zbus"] }
aes-gcm = "0.10"
aead = { version = "0.5", features = ["stream"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
