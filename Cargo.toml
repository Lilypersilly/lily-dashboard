[package]
name = "lily-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
gtk4-layer-shell = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# --- BEGIN MODULE DEPENDENCIES (managed by lily-dashboard) ---
aead = { version = "0.5", features = ["stream"] }
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
notify = "6.1"
souvlaki = { version = "0.7", default-features = false, features = ["use_zbus"] }
zbus = "3.15"
# --- END MODULE DEPENDENCIES ---
